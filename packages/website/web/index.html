<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Heidrun Git Runner</title>
		<link rel="icon" type="image/svg+xml" href="../../../data/images/heidrun_favicon.svg" />
		<style>
			/* The colors of the branding are in docs/branding.md. */
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #fff4dc;
				color: #2b1a10;
				font-family: system-ui, sans-serif;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				padding: 48px 16px;
				text-align: center;
			}
			main img {
				width: 128px;
				height: 128px;
			}
			h1 {
				margin: 16px 0 8px;
				font-size: 2.2rem;
			}
			p {
				margin: 0 0 32px;
				font-size: 1.1rem;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 16px;
				justify-content: center;
			}
			nav a {
				display: block;
				min-width: 220px;
				padding: 20px 24px;
				border-radius: 12px;
				background: #d9480f;
				color: #fff4dc;
				font-size: 1.3rem;
				font-weight: 600;
				text-decoration: none;
			}
			nav a:hover,
			nav a:focus-visible {
				background: #b83a0b;
				outline: none;
			}
			nav a span {
				display: block;
				margin-top: 4px;
				font-size: 0.9rem;
				font-weight: 400;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="../../../data/images/heidrun_icon.png" alt="The goat Heiðrún" />
			<h1>Heidrun Git Runner</h1>
			<p>Two games about a goat and about Git.</p>
			<nav>
				<a href="./2d/">
					Git Runner
					<span>The 2D game</span>
				</a>
				<a href="./3d/">
					Heidrun 3D
					<span>The 3D game</span>
				</a>
			</nav>
		</main>
	</body>
</html>
